<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | E-commerce product page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="navbar">
    <div class="hamburger-menu">
      <i class="fa fa-bars"></i>
    </div>

    <nav>
      <ul>
        <a href="#" class="nav-link">Collections</a>
        <a href="#" class="nav-link">Men</a>
        <a href="#" class="nav-link">Women</a>
        <a href="#" class="nav-link">About</a>
        <a href="#" class="nav-link">Contact</a>
      </ul>
    </nav>

    <a href="index.html" class="logo">
      <img src="images/logo.svg" alt="Logo icon">
    </a>

    <div class="cart_icon_and_pfp-container">
      <i class="fa fa-cart-shopping"></i>
    </div>
    <img src="images/image-avatar.png" alt="Profile picture">
  </header>

  <!--  SLIDER IMAGES -->
  <div class="slider-container">
    <div class="slide">
      <img src="images/image-product-1.jpg" alt="Firt product">
    </div>
    
    <div class="slide">
      <img src="images/image-product-2.jpg" alt="Second product">
    </div>

    <div class="slide">
      <img src="images/image-product-3.jpg" alt="Third product">
    </div>

    <div class="slide">
      <img src="images/image-product-4.jpg" alt="Fourth product">
    </div>
  </div>

  <!-- NAVIGATION BUTTONS -->
  <button class="prev" onclick="showPrev()">
    <i class="fa fa-arrow-left"></i>
  </button>
  <button class="next" onclick="showNext()">
    <i class="fa fa-arrow-right"></i>
  </button>
  
  <script src="js/main.js"></script>
</body>
</html>
